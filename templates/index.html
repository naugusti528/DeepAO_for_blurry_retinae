<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retinal Image Restoration Panel</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col items-center py-12 px-4">

    <!-- Header Panel -->
    <div class="max-w-5xl w-full text-center mb-10">
        <h1 class="text-4xl font-extrabold tracking-tight text-emerald-400 mb-2">Retinal Image Restoration Engine</h1>
        <p class="text-slate-400">High-Throughput Green-Channel Spatial U-Net Deconvolution Pipeline</p>
    </div>

    <!-- Upload Box Component -->
    <div class="max-w-xl w-full bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-xl mb-12">
        <form id="uploadForm" class="flex flex-col items-center gap-6">
            <label class="w-full flex flex-col items-center px-4 py-8 bg-slate-900 text-slate-400 rounded-xl border-2 border-dashed border-slate-600 cursor-pointer hover:border-emerald-500 hover:text-slate-200 transition-colors">
                <svg class="w-12 h-12 mb-3 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                <span class="text-sm font-medium" id="uploadLabel">Select retinal file (.jpg / .png)</span>
                <input type="file" id="imageInput" accept="image/*" class="hidden" required>
            </label>
            <button type="submit" class="w-full py-3 px-6 font-semibold bg-emerald-500 text-slate-950 rounded-xl hover:bg-emerald-400 active:scale-95 transition-all shadow-lg shadow-emerald-500/20">
                Enhance Diagnostic Scan
            </button>
        </form>
    </div>

    <!-- Split-Screen Results Display Grid -->
    <div id="resultsGrid" class="max-w-5xl w-full grid grid-cols-1 md:grid-cols-2 gap-8 hidden">
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl flex flex-col items-center">
            <h3 class="text-lg font-bold text-slate-300 mb-4">Green-Channel Blurred Input</h3>
            <img id="inputImg" class="rounded-xl border border-slate-900 w-full aspect-square object-cover" src="" alt="Input View">
        </div>
        <div class="bg-slate-800 p-6 rounded-2xl border border-emerald-800 shadow-xl flex flex-col items-center">
            <h3 class="text-lg font-bold text-emerald-400 mb-4">7-Way Ensemble Restored Details</h3>
            <img id="outputImg" class="rounded-xl border border-slate-900 w-full aspect-square object-cover" src="" alt="Output View">
        </div>
    </div>

    <script>
        // Update label text dynamically when a user selects a file
        const fileInput = document.getElementById('imageInput');
        const uploadLabel = document.getElementById('uploadLabel');
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                uploadLabel.textContent = `Selected: ${fileInput.files[0].name}`;
            }
        });

        // Form submission network link handling
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!fileInput.files.length) return;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                // Send the image bytes over HTTP to the backend server app.py
                const response = await fetch('/deblur', { method: 'POST', body: formData });
                const data = await response.json();
                
                if (data.error) {
                    alert(data.error);
                } else {
                    // Update image source URLs dynamically using cache-busting timestamp parameters
                    document.getElementById('inputImg').src = data.input_url + '?t=' + new Date().getTime();
                    document.getElementById('outputImg').src = data.output_url + '?t=' + new Date().getTime();
                    document.getElementById('resultsGrid').classList.remove('hidden');
                }
            } catch (err) {
                alert('Server network handshake error occurred.');
            }
        });
    </script>
</body>
</html>
