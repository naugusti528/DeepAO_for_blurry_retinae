<!-- frontend for full stack -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retinal Image Restoration Panel</title>
    <style>
        body { background-color: #0f172a; color: #f1f5f9; font-family: sans-serif; display: flex; flex-direction: column; items-center; padding: 40px 16px; margin: 0; }
        .header-title { color: #34d399; font-size: 32px; font-weight: 800; margin-bottom: 8px; text-align: center; }
        .header-sub { color: #94a3b8; font-size: 16px; margin-bottom: 40px; text-align: center; }
        
        .upload-container { max-width: 440px; width: 100%; bg-color: #1e293b; padding: 24px; border-radius: 16px; border: 1px solid #334155; margin: 0 auto 48px auto; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); text-align: center; }
        .drop-zone { display: flex; flex-direction: column; items-center; padding: 20px; border: 2px dashed #475569; border-radius: 12px; cursor: pointer; color: #94a3b8; text-decoration: none; margin-bottom: 20px; }
        .drop-zone:hover { border-color: #10b981; color: #e2e8f0; }
        .submit-btn { width: 100%; padding: 12px; font-weight: 600; background-color: #10b981; color: #022c22; border: none; border-radius: 12px; cursor: pointer; font-size: 16px; transition: transform 0.1s; }
        .submit-btn:active { transform: scale(0.97); }
        
        .results-grid { max-width: 1000px; width: 100%; display: grid; grid-template-columns: 1fr; gap: 32px; margin: 0 auto; }
        @media (min-width: 768px) { .results-grid { grid-template-columns: 1fr 1fr; } }
        .card { background-color: #1e293b; padding: 20px; border-radius: 16px; border: 1px solid #334155; display: flex; flex-direction: column; items-center; }
        .card-title { font-size: 18px; font-weight: 700; color: #94a3b8; margin-top: 0; margin-bottom: 16px; }
        .card-title.active { color: #34d399; }
        
        /* greenscale */
        .retinal-display-frame { position: relative; width: 100%; aspect-ratio: 1/1; border-radius: 12px; overflow: hidden; background-color: #000; border: 1px solid #0f172a; }
        .retinal-img { width: 100%; height: 100%; object-fit: cover; }
        .green-overlay { display: none; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="header-title">Retinal Image Restoration Engine</div>
    <div class="header-sub">High-Throughput Green-Channel Spatial U-Net Deconvolution Pipeline</div>

    <!-- Sized Upload Module -->
    <div class="upload-container">
        <form id="uploadForm">
            <label class="drop-zone">
                <svg style="width:40px; height:40px; margin-bottom:12px; color:#10b981;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                <span id="uploadLabel" style="font-size:14px;">Select retinal file (.jpg / .png)</span>
                <input type="file" id="imageInput" accept="image/*" class="hidden" required>
            </label>
            <button type="submit" class="submit-btn">Enhance Diagnostic Scan</button>
        </form>
    </div>

    <!-- Unified Display Dashboard -->
    <div id="resultsGrid" class="results-grid hidden">
        <div class="card">
            <h3 class="card-title">Green-Channel Blurred Input</h3>
            <div class="retinal-display-frame">
                <img id="inputImg" class="retinal-img" src="">
            </div>
        </div>
        <div class="card" style="border-color: #064e3b;">
            <h3 class="card-title active">7-Way Ensemble Restored Details</h3>
            <div class="retinal-display-frame">
                <img id="outputImg" class="retinal-img" src="">
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('imageInput');
        const uploadLabel = document.getElementById('uploadLabel');
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                uploadLabel.textContent = `Selected: ${fileInput.files[0].name}`;
                uploadLabel.style.color = '#34d399';
            }
        });

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!fileInput.files.length) return;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('/deblur', { method: 'POST', body: formData });
                const data = await response.json();
                
                if (data.error) {
                    alert(data.error);
                } else {
                    document.getElementById('inputImg').src = data.input_url + '?t=' + new Date().getTime();
                    document.getElementById('outputImg').src = data.output_url + '?t=' + new Date().getTime();
                    document.getElementById('resultsGrid').classList.remove('hidden');
                }
            } catch (err) {
                alert('Server network handshake error occurred.');
            }
        });
    </script>
</body>
</html>
